name: Esegui Scanner Drawdown

on:
  workflow_dispatch: # Questo permette di attivarlo manualmente con un pulsante

jobs:
  run-scanner:
    runs-on: ubuntu-latest
    steps:
    - name: Accesso ai file della repository
      uses: actions/checkout@v4

    - name: Configurazione Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Installazione Librerie
      run: |
        pip install pandas numpy yfinance git+https://github.com/rongardF/tvdatafeed.git

    - name: Esecuzione Script Python
      run: python main.py

    - name: Salva il file CSV generato nella repository
      run: |
        git config --global user.name 'GitHub Actions'
        git config --global user.email 'actions@github.com'
        git add *.csv || echo "Nessun file CSV generato"
        git commit -m "Aggiornato CSV statistiche" || echo "Nessuna modifica"
        git push
